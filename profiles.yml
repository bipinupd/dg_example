dbt_data_governance_tags_example:
  target: "{{ env_var('DBT_TARGET', '') or 'dev' }}"
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', '') or 'your-gcp-project-id' }}"
      dataset: "{{ env_var('BQ_DATASET', '') or 'dbt_dgt_example' }}"
      location: "{{ env_var('BQ_LOCATION', '') or 'US' }}"
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
      labels:
        datacloud: antigravity
        example: dbt_data_governance_tags

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', '') or 'your-gcp-project-id' }}"
      dataset: "{{ env_var('BQ_DATASET', '') or 'dbt_dgt_example_prod' }}"
      location: "{{ env_var('BQ_LOCATION', '') or 'US' }}"
      threads: 8
      job_execution_timeout_seconds: 600
      priority: interactive
      labels:
        datacloud: antigravity
        example: dbt_data_governance_tags
