name: 'dbt_data_governance_tags_example'
version: '1.0.0'
config-version: 2

profile: 'dbt_data_governance_tags_example'

model-paths: ['models']
analysis-paths: ['analyses']
test-paths: ['tests']
seed-paths: ['seeds']
macro-paths: ['macros']
snapshot-paths: ['snapshots']

clean-targets:
  - 'target'
  - 'dbt_packages'

# ---------------------------------------------------------------------------
# Configurable Data Governance Tag variables
# ---------------------------------------------------------------------------
# By default, tags are resolved under GCP_PROJECT_ID (the same project used in
# profiles.yml). If your Resource Manager Data Governance Tag Keys live under a
# GCP Organization ID (e.g. "94408448616") or a centralized governance project,
# override DGT_PARENT_ID (or pass --vars '{"dgt_parent_id": "..."}').
#
# Note: dbt-core does not render Jinja inside dbt_project.yml `vars:`.
# Leave `dgt_parent_id`, `dgt_class_key_name`, and `dgt_domain_key_name` empty
# to auto-resolve at parse time via:
#   --vars override -> env_var(...) -> target.database / default short name.
# Tag values MUST be the leaf tag value shortName (e.g. "email", NOT "pii/email").
vars:
  dgt_parent_id: ''
  dgt_class_key_name: ''
  dgt_domain_key_name: ''
  dgt_email_tag_value: 'email'
  dgt_ssn_tag_value: 'ssn'
  dgt_public_tag_value: 'public'
  dgt_finance_tag_value: 'finance'

# ---------------------------------------------------------------------------
# Resource configurations
# ---------------------------------------------------------------------------
# `persist_docs.columns: true` is REQUIRED for dbt-bigquery to patch BigQuery
# column descriptions and `data_governance_tags` onto materialized tables,
# incremental models, seeds, and snapshots.
#
# All resources materialize into the single configurable BQ_DATASET by default
# so inspection and teardown are self-contained. Add `+schema:` suffixes per
# folder if your team prefers separate staging/marts datasets.
models:
  dbt_data_governance_tags_example:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  dbt_data_governance_tags_example:
    +persist_docs:
      relation: true
      columns: true

snapshots:
  dbt_data_governance_tags_example:
    +persist_docs:
      relation: true
      columns: true
