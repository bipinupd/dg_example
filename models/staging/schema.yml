version: 2

models:
  - name: stg_customers
    description: >-
      Cleaned staging view over `raw_customers`. BigQuery does not permit
      attaching `data_governance_tags` directly onto VIEW columns; column
      descriptions are persisted safely while access control and masking are
      inherited automatically from the tagged `raw_customers` table.
    columns:
      - name: customer_id
        description: "Primary customer identifier."
        data_tests:
          - unique
          - not_null
      - name: full_name
        description: "Whitespace-trimmed customer full name (case preserved)."
      - name: email
        description: "Trimmed personal email (inherits governance tag from raw_customers)."
        data_tests:
          - not_null
      - name: work_email
        description: "Trimmed work email (inherits governance tag from raw_customers)."
      - name: ssn
        description: "Trimmed synthetic SSN (inherits governance tag from raw_customers)."
      - name: country_code
        description: "ISO-2 country code."
      - name: loyalty_tier
        description: "Trimmed loyalty tier (Gold, Silver, Platinum, Bronze)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Bronze', 'Silver', 'Gold', 'Platinum']
      - name: annual_income_usd
        description: "Typed NUMERIC annual income in USD."
      - name: updated_at
        description: "UTC timestamp when the customer record was last updated."
        data_tests:
          - not_null

  - name: stg_orders
    description: >-
      Cleaned staging view over `raw_orders` with normalized DATE values and
      typed NUMERIC amounts. View columns carry descriptions only (no direct
      `data_governance_tags`).
    columns:
      - name: order_id
        description: "Primary order identifier."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key referencing stg_customers.customer_id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: "Normalized BigQuery DATE parsed from YYYY-MM-DD or MM/DD/YYYY."
        data_tests:
          - not_null
      - name: amount_usd
        description: "Typed NUMERIC order amount in USD."
      - name: status
        description: "Order status (completed or cancelled)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'cancelled']
      - name: actor_email
        description: "Actor email address (inherits governance tag from raw_orders)."
      - name: event_type
        description: "Order event category (checkout, renewal, upgrade, refund)."
