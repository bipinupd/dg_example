version: 2

snapshots:
  - name: customers_snapshot
    description: >-
      SCD Type 2 history table (SQL snapshot block) demonstrating
      `data_governance_tags` persisted via `dbt snapshot` on dbt Core 1.x.
    columns:
      - name: customer_id
        description: "Primary customer identifier (untagged)."
      - name: email
        description: "Snapshotted customer email protected by a Data Governance Tag."
        data_governance_tags: "{{ { ((var('dgt_parent_id') or env_var('DGT_PARENT_ID', '') or target.database) ~ '/' ~ (var('dgt_class_key_name') or env_var('DGT_CLASS_KEY_NAME', '') or var('dgt_class_key_default'))): var('dgt_email_tag_value') } }}"
      - name: ssn
        description: "Snapshotted synthetic SSN protected by a Data Governance Tag."
        data_governance_tags: "{{ { ((var('dgt_parent_id') or env_var('DGT_PARENT_ID', '') or target.database) ~ '/' ~ (var('dgt_class_key_name') or env_var('DGT_CLASS_KEY_NAME', '') or var('dgt_class_key_default'))): var('dgt_ssn_tag_value') } }}"
      - name: loyalty_tier
        description: "Snapshotted loyalty tier tagged as `public`."
        data_governance_tags: "{{ { ((var('dgt_parent_id') or env_var('DGT_PARENT_ID', '') or target.database) ~ '/' ~ (var('dgt_class_key_name') or env_var('DGT_CLASS_KEY_NAME', '') or var('dgt_class_key_default'))): var('dgt_public_tag_value') } }}"
      - name: updated_at
        description: "Source update UTC timestamp used for SCD-2 change detection."
