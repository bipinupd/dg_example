name: 'dbt_fusion_dgt_example'
version: '1.0.0'
config-version: 2

profile: 'dbt_fusion_dgt_example'

model-paths: ['models']
snapshot-paths: ['snapshots']

clean-targets:
  - 'target'
  - 'dbt_packages'

# ---------------------------------------------------------------------------
# Configurable Data Governance Tag variables
# ---------------------------------------------------------------------------
# Shared seeds, staging models, dim_customers, v_customers_public, tests, and
# audit macro are imported from the local package `../common` (`dbt_dgt_common`).
#
# Leave `dgt_parent_id`, `dgt_class_key_name`, and `dgt_domain_key_name` empty
# to auto-resolve at schema parse time via:
#   --vars override -> env_var(...) -> target.database / default short name.
vars:
  dgt_parent_id: ''
  dgt_class_key_name: ''
  dgt_domain_key_name: ''
  dgt_class_key_default: 'dbt_fusion_dgt_class'
  dgt_domain_key_default: 'dbt_fusion_dgt_domain'
  dgt_email_tag_value: 'email'
  dgt_ssn_tag_value: 'ssn'
  dgt_public_tag_value: 'public'
  dgt_finance_tag_value: 'finance'

# ---------------------------------------------------------------------------
# Resource configurations (dbt v2 / Fusion: root + shared `dbt_dgt_common`)
# ---------------------------------------------------------------------------
# BigQuery labels are configured here via `+labels` (per Fusion's strict
# schema validation on `BigqueryDbConfig`).
models:
  dbt_dgt_common:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      datacloud: antigravity
      example: dbt_fusion_dgt
  dbt_fusion_dgt_example:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      datacloud: antigravity
      example: dbt_fusion_dgt
    marts:
      +materialized: table

seeds:
  dbt_dgt_common:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      datacloud: antigravity
      example: dbt_fusion_dgt

snapshots:
  dbt_fusion_dgt_example:
    +persist_docs:
      relation: true
      columns: true
    +labels:
      datacloud: antigravity
      example: dbt_fusion_dgt
